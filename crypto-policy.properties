# Politique cryptographique de l'application d'archivage
# Étape 3 : protection hybride de la clé AES (X25519 + ML-KEM-768)
# ML-KEM-768 seul, RSA et ECDSA ne servent plus qu'à relire les archives existantes

write.keyProtection = X25519-ML-KEM-768-HKDF-SHA256-AESKW256
write.signature     = ML-DSA-65

state.X25519-ML-KEM-768-HKDF-SHA256-AESKW256 = ALLOWED
state.ML-DSA-65                              = ALLOWED
state.ML-KEM-768-HKDF-SHA256-AESKW256        = READ_ONLY
state.RSA-OAEP-3072-SHA256                   = READ_ONLY
state.ECDSA-P256-SHA256                      = READ_ONLY
state.LEGACY-V1                              = READ_ONLY