# Politique cryptographique de l'application d'archivage
# Étape 1 : introduction de la couche, mêmes algorithmes que la version de référence

write.keyProtection = RSA-OAEP-3072-SHA256
write.signature     = ECDSA-P256-SHA256

state.RSA-OAEP-3072-SHA256 = ALLOWED
state.ECDSA-P256-SHA256    = ALLOWED
state.LEGACY-V1            = READ_ONLY