# Politique cryptographique de l'application d'archivage
# Étape 2 : migration vers la cryptographie post-quantique
# Les algorithmes classiques ne servent plus qu'à relire les archives existantes

write.keyProtection = ML-KEM-768-HKDF-SHA256-AESKW256
write.signature     = ML-DSA-65

state.ML-KEM-768-HKDF-SHA256-AESKW256 = ALLOWED
state.ML-DSA-65                       = ALLOWED
state.RSA-OAEP-3072-SHA256            = READ_ONLY
state.ECDSA-P256-SHA256               = READ_ONLY
state.LEGACY-V1                       = READ_ONLY